==='vquiz'?vocabQuiz:phraseQuiz)[quizIndex%(page==='vquiz'?vocabQuiz:phraseQuiz).length];selected=i;streak=i===q.c?streak+1:0;render();toast(i===q.c?'回答正确 ✓':'再试一次');setTimeout(()=>{if(page!=='vquiz'&&page!=='pquiz')return;if(streak===3){completeLesson();return}quizIndex++;selected=null;render()},780)}function renderPhrases(){set(pageTop(topics[topic].title,topics[topic].progress+' / 4')+progress(topics[topic].progress)+'<h1>Phrases & Sentences</h1><p class="sub">学习日常生活中常用的表达，帮助你在真实场景中更自然地交流。</p>'+dialogs.map((d,i)=>'<div class="card"><div class="row"><span class="eyebrow">SCENE 0'+(i+1)+'</span><button class="speaker" onclick="speak(this)">🔊</button></div><div class="dialog"><span class="avatar">A</span><div class="bubble">'+d[0]+'</div></div><div class="dialog"><span class="avatar">B</span><div class="bubble">'+d[1]+'</div></div><p class="sub tiny">'+d[2]+'</p></div>').join('')+'<div class="card soft"><h3>重点搭配</h3>'+phrases.map(x=>'<p>• '+x+'</p>').join('')+'</div>');bottom('<button class="btn full" onclick="beginQuiz(\'pquiz\')">熟悉完成，开始练习 →</button>')}function completeLesson(){topics[topic].progress=Math.max(topics[topic].progress,lesson+1);topics[topic].current=Math.max(topics[topic].current,lesson+1);if(topics[topic].progress===4)expanded.delete(topic);go('complete')}function renderComplete(){let t=topics[topic];set(pageTop('学习完成')+'<div class="bigcheck">✓</div><div class="center"><h1>本关学习完成！</h1><p class="sub">'+t.title+'</p><strong>'+t.progress+' / 4</strong><div style="display:flex;justify-content:center">'+progress(t.progress)+'</div></div><div class="card soft" style="margin-top:44px"><div class="eyebrow">下一关</div><h2>'+names[lesson+1]+'</h2><p class="sub">'+(lesson===0?'学习常用表达，让交流更自然。':'和 AI 进行情景对话，练习实际表达。')+'</p></div>');bottom('<button class="btn secondary" onclick="go(\'home\')">稍后继续</button><button class="btn" onclick="startLesson('+topic+','+(lesson+1)+')">下一关 →</button>')}function submitAnswer(text){if(!text.trim()){let el=$('#answerInput');el.classList.add('error');toast('请输入回答');return}answer=text.trim();mode='analyzing';render();setTimeout(()=>{if(page==='conversation'){feedback=true;mode='ready';render()}},800)}function mic(){if(mode!=='ready')return;mode='listening';render();setTimeout(()=>{if(page!=='conversation')return;answer=demoAnswers[convIndex];mode='analyzing';render();setTimeout(()=>{if(page==='conversation'){feedback=true;mode='ready';render()}},800)},1500)}function renderConversation(){let l=lesson;let score=attempt?84:76;let metrics=attempt?[['流畅度',85],['词汇丰富度',80],['语法正确度',87],['自然表达',84]]:[['流畅度',78],['词汇丰富度',72],['语法正确度',81],['自然表达',73]];set(pageTop(topics[topic].title+' · '+names[l],(convIndex+1)+' / 5')+'<div class="eyebrow">QUESTION '+(convIndex+1)+' / 5</div><div class="dialog"><span class="avatar">AI</span><div class="bubble">'+questions[convIndex]+'</div></div>'+(answer?'<div class="dialog me"><div class="bubble">'+esc(answer)+'</div></div>':'')+(mode==='listening'||mode==='analyzing'?'<div class="card soft center">'+(mode==='listening'?'正在聆听...':'正在分析...')+'</div>':'')+(feedback?'<div class="card"><div class="row"><h3>本题表现</h3><strong style="font-size:27px;color:var(--blue)">'+(attempt?'76 → 84 <small style="font-size:13px;color:var(--green)">+8</small>':score)+'</strong></div>'+metrics.map(m=>'<div class="metric"><div class="row sub"><span>'+m[0]+'</span><strong>'+m[1]+'</strong></div>'+bar(m[1])+'</div>').join('')+'</div><div class="card soft"><div class="eyebrow">可以表达得更自然</div><p>I usually stay at home and watch TV because I want to relax after a busy week.</p></div>':'<div class="card center" style="margin-top:30px"><button class="btn" style="border-radius:50%;height:64px;width:64px;font-size:26px" onclick="mic()" '+(mode!=='ready'?'disabled':'')+'>🎙</button><p class="sub">点击麦克风开始回答</p></div><div class="inputrow"><input id="answerInput" placeholder="输入回答..." onkeydown="if(event.key===\'Enter\')submitAnswer(this.value)"><button class="btn" onclick="submitAnswer($(\'#answerInput\').value)">发送</button></div>'));if(feedback)bottom('<button class="btn secondary" onclick="attempt++;answer=\'\';feedback=false;render()">🎙 再说一次</button><button class="btn" onclick="nextQuestion()">'+(convIndex===4?'查看报告 →':'下一题 →')+'</button>');else $('#footer').innerHTML=''}function nextQuestion(){if(convIndex<4){convIndex++;answer='';feedback=false;attempt=0;mode='ready';render()}else{topics[topic].progress=Math.max(topics[topic].progress,lesson+1);topics[topic].current=Math.max(topics[topic].current,lesson+1);if(topics[topic].progress===4){expanded.delete(topic);go('topiccomplete')}else go('report')}}function renderReport(){set(pageTop(names[lesson]+' 完成','✓')+'<div class="card soft center"><div class="eyebrow">综合表现</div><div style="font-size:54px;font-weight:800;color:var(--blue)">82</div><p class="sub">你完成了全部 5 个问题</p></div><div class="card"><h3>核心指标</h3>'+[['流畅度',80],['词汇丰富度',76],['语法正确度',88]].map(m=>'<div class="metric"><div class="row"><span>'+m[0]+'</span><b>'+m[1]+'</b></div>'+bar(m[1])+'</div>').join('')+'</div><div class="card"><h3>本次调整</h3><div class="row sub"><span>第一次</span><span>最终</span></div><div class="row"><strong>72</strong><span>→</span><strong style="color:var(--green)">84</strong></div><div class="row"><strong>68</strong><span>→</span><strong style="color:var(--green)">81</strong></div></div><div class="card"><h3>需要继续注意</h3><p class="sub">• 回答容易过短</p><p class="sub">• 过去时使用不稳定</p><p class="sub">• 部分表达比较重复</p></div><div class="card soft"><h3>可以尝试</h3><p>I usually...</p><p>I tend to...</p><p>Most of the time...</p><p>When I have some free time...</p></div>');bottom('<button class="btn secondary" onclick="go(\'home\')">稍后继续</button><button class="btn" onclick="startLesson('+topic+','+(lesson+1)+')">下一关 →</button>')}function renderTopicComplete(){let t=topics[topic];set(pageTop('Topic 完成')+'<div class="bigcheck">✓</div><div class="center"><h1>'+t.title+' 完成！</h1><p class="sub">4 / 4</p><div style="display:flex;justify-content:center">'+progress(4)+'</div><p class="sub" style="margin-top:25px">你已经完成本 Topic 的全部学习内容。</p></div><div class="card row" style="margin-top:40px"><span>6 个重点词汇</span><strong>✓</strong></div><div class="card row"><span>6 个重点表达</span><strong>✓</strong></div><div class="card row"><span>2 次 Conversation</span><strong>✓</strong></div>');bottom('<button class="btn secondary" onclick="go(\'home\')">返回首页</button><button class="btn" onclick="go(\'records\')">查看学习记录</button>')}function renderRecords(){set('<h1>学习记录</h1><div class="row"><div class="card" style="flex:1"><div class="eyebrow">今天</div><h2>3 个关卡</h2><p class="sub">学习 24 分钟</p></div><div class="card" style="flex:1"><div class="eyebrow">本周</div><h2>2 个 Topic</h2><p class="sub">完成 8 个关卡</p></div></div><h2>最近学习</h2>'+[['09/22','Daily Life',['Vocabulary','Phrases','Conversation 1']],['09/21','My Daily Routine',['Vocabulary']],['09/20','Weekend Plans',[]]].map((d,i)=>'<details class="card" '+(i===0?'open':'')+'><summary style="cursor:pointer;font-weight:700">'+d[0]+' · '+d[1]+'</summary>'+(d[2].length?d[2].map(x=>'<div class="lesson completed" '+(x.includes('Conversation')?'onclick="lesson=2;go(\'report\')"':'')+'>✓　'+x+'</div>').join(''):'<p class="sub">暂无记录</p>')+'</details>').join('')+'<div class="card soft"><div class="eyebrow">最近的进步 · AI 学习总结</div><p>最近一周你的回答长度有所增加，语法正确度保持稳定。过去时仍然是需要重点练习的内容。</p></div><div class="card"><h3>需要复习</h3><p class="sub">12 个历史问题</p><button class="btn" onclick="go(\'review\')">开始复习</button></div>');tabs('records')}function renderReview(){set(pageTop('复习')+'<div class="center" style="padding-top:130px"><div style="font-size:54px;color:var(--blue)">▤</div><h1>复习</h1><p class="sub">根据你最近的学习记录，这里会整理需要再次练习的内容。</p><div class="card soft">复习功能正在完善中</div></div>');bottom('<button class="btn full" onclick="go(\'records\')">返回学习记录</button>')}function renderProfile(){set('<h1>我的</h1><div class="card center" style="padding:30px"><div style="width:64px;height:64px;border-radius:50%;background:var(--pale);color:var(--blue);display:grid;place-items:center;font-size:28px;margin:auto">G</div><h2 style="margin-top:14px">Guest Learner</h2></div><div class="card"><p class="sub">学习目标</p><h3>提升英语口语</h3><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><p class="sub">当前学习</p><h3>Daily Life</h3></div><div class="card row" style="cursor:pointer" onclick="modal=true;renderModal()"><strong>关于产品</strong><span class="sub">→</span></div>');tabs('profile')}function renderModal(){if(!modal){$('#overlay').innerHTML='';return}$('#overlay').innerHTML='<div class="modalwrap" onclick="modal=false;renderModal()"><div class="modal" onclick="event.stopPropagation()"><div class="row"><span></span><button class="iconbtn" onclick="modal=false;renderModal()">×</button></div><h2>AI English Speaking Practice</h2><p class="sub">Prototype Demo</p></div></div>'}function render(){if(page==='home')renderHome();else if(page==='vocab')renderVocab();else if(page==='word')renderWord();else if(page==='vquiz'||page==='pquiz')renderQuiz();else if(page==='phrases')renderPhrases();else if(page==='complete')renderComplete();else if(page==='conversation')renderConversation();else if(page==='report')renderReport();else if(page==='topiccomplete')renderTopicComplete();else if(page==='records')renderRecords();else if(page==='review')renderReview();else if(page==='profile')renderProfile()}render();
</script></body></html>
